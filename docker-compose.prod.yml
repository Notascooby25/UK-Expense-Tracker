services:
  expense-tracker:
    image: ghcr.io/notascooby25/uk-expense-tracker:latest
    container_name: uk_expense_tracker
    ports:
      - "8501:8501"
    environment:
      - EXPENSE_TRACKER_DATA_DIR=/app/data
      - EXPENSE_TRACKER_ENV=production
    volumes:
      - ./data:/app/data
      - ./.streamlit/secrets.toml:/app/.streamlit/secrets.toml:ro
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - com.centurylinklabs.watchtower.scope=expense_tracker
    restart: unless-stopped

  expense-tracker-web:
    image: ghcr.io/notascooby25/uk-expense-tracker-web:latest
    container_name: uk_expense_tracker_web
    ports:
      - "8502:8502"
    environment:
      - EXPENSE_TRACKER_DATA_DIR=/app/data
      - EXPENSE_TRACKER_ENV=production
    volumes:
      - ./data:/app/data
      - ./.streamlit/secrets.toml:/app/.streamlit/secrets.toml:ro
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - com.centurylinklabs.watchtower.scope=expense_tracker
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower_expense_tracker
    command: --label-enable --cleanup --interval 300 --scope expense_tracker
    environment:
      - DOCKER_API_VERSION=1.40
      - WATCHTOWER_SCOPE=expense_tracker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
