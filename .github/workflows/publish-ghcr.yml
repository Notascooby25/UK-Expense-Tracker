name: Publish Container to GHCR

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Streamlit Container
      - name: Extract metadata (Streamlit)
        id: meta-streamlit
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/notascooby25/uk-expense-tracker
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push (Streamlit)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta-streamlit.outputs.tags }}
          labels: ${{ steps.meta-streamlit.outputs.labels }}
          cache-from: type=gha,scope=streamlit
          cache-to: type=gha,mode=max,scope=streamlit

      # React + FastAPI Container
      - name: Extract metadata (React + FastAPI)
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/notascooby25/uk-expense-tracker-web
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push (React + FastAPI)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.web
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
