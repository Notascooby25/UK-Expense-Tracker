name: Checks

# Runs on every pull request, and from publish-ghcr.yml before anything is
# published, so broken code can't reach production by either route.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest ruff==0.9.9

      - name: Run linter
        run: ruff check .

      - name: Run tests
        run: pytest

      - name: Run script tests
        run: |
          bash scripts/tests/test_check_backup_fresh.sh
          bash scripts/tests/test_data_backup.sh
          bash scripts/tests/test_preview.sh

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build
